[package]
name = "input-only-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Unidirectional TCP to Unix socket proxy with Ed25519 authentication for TDX environments"
homepage = "https://github.com/flashbots/input-only-proxy"
repository = "https://github.com/flashbots/input-only-proxy"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
ssh-key = { version = "0.6.7", features = ["ed25519"] }
rand = "0.9.2"
hex = "0.4"
anyhow = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
clap = { version = "4.5.54", features = ["derive", "env"] }

# TLS support
rustls = { version = "0.23", features = ["std", "ring"] }
tokio-rustls = "0.26"
rcgen = { version = "0.14.7", features = ["crypto"] }
rustls-pemfile = "2.2.0"
webpki-roots = "1.0.5"
x509-parser = "0.18.0"
