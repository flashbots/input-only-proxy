[package]
name = "secure-input-proxy"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Secure unidirectional TCP to Unix socket proxy with Ed25519 authentication for TDX environments"
homepage = "https://github.com/flashbots/secure-input-proxy"
repository = "https://github.com/flashbots/secure-input-proxy"

[dependencies]
tokio = { version = "1.49.0", features = ["full"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
ssh-key = { version = "0.6.7", features = ["ed25519"] }
rand = "0.9.2"
hex = "0.4"
anyhow = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
clap = { version = "4.5.54", features = ["derive", "env"] }

